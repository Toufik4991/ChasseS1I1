<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Speedrun 4x4</title>
<style>
body {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:#f0f0f0;
  font-family: Arial, sans-serif;
  margin:0;
  overflow: hidden;
}

#chrono {
  font-size:40px;
  font-weight:bold;
  margin-bottom:20px;
  padding:10px 30px;
  background:white;
  border-radius:12px;
  border:3px solid #333;
  transition: all 0.2s ease;
}

.danger {
  color: #ff0000;
  border-color: #ff0000 !important;
  animation: pulse 0.4s infinite alternate;
  transform: scale(1.2);
}

@keyframes pulse {
  from { box-shadow: 0 0 5px #ff0000; }
  to { box-shadow: 0 0 25px #ff0000; }
}

#puzzle {
  display:grid;
  grid-template-columns:repeat(4, 80px);
  grid-template-rows:repeat(4, 80px);
  gap:4px;
  background: #333;
  padding: 6px;
  border-radius: 8px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.piece {
  width:80px;
  height:80px;
  background-size:320px 320px;
  cursor:pointer;
  touch-action:manipulation;
  border-radius:2px;
}

/* Écran de victoire total */
#result {
  display:none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: white;
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#result img {
  max-width: 95%;
  max-height: 80vh;
  box-shadow: 0 0 50px rgba(0,0,0,0.1);
  border-radius: 10px;
}

.restart-link {
  margin-top: 30px;
  color: #666;
  text-decoration: none;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div id="game-ui">
    <div id="chrono">00:30</div>
    <div id="puzzle"></div>
</div>

<div id="result">
  <img src="Imprim.png" alt="Victoire">
  <a href="#" class="restart-link" onclick="location.reload()">Rejouer</a>
</div>

<script>
const puzzle = document.getElementById('puzzle');
const result = document.getElementById('result');
const chronoDisplay = document.getElementById('chrono');
const gameUI = document.getElementById('game-ui');

const size = 4; 
const pieceWidth = 80;
let pieces = Array.from({length: size * size}, (_, i) => i);

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

pieces = shuffle([...pieces]);

function renderPuzzle() {
  puzzle.innerHTML = '';
  pieces.forEach((num, index) => {
    const div = document.createElement('div');
    div.className = 'piece';
    div.dataset.index = index;
    div.style.backgroundImage = "url('Imprim.png')";
    
    const x = -(num % size) * pieceWidth;
    const y = -Math.floor(num / size) * pieceWidth;
    
    div.style.backgroundPosition = `${x}px ${y}px`;
    puzzle.appendChild(div);
  });
}

renderPuzzle();

let first = null;
puzzle.addEventListener('click', e => {
  if (!e.target.classList.contains('piece')) return;
  
  if (!first) {
    first = e.target;
    first.style.outline = '4px solid #fbc02d';
    first.style.zIndex = '10';
  } else {
    const second = e.target;
    const idx1 = first.dataset.index;
    const idx2 = second.dataset.index;
    
    [pieces[idx1], pieces[idx2]] = [pieces[idx2], pieces[idx1]];
    
    first.style.outline = '';
    first = null;
    renderPuzzle();
    checkWin();
  }
});

function checkWin() {
  if (pieces.every((val, i) => val === i)) {
    clearInterval(timer);
    // On cache tout le reste et on affiche l'image seule
    gameUI.style.display = 'none';
    result.style.display = 'flex';
  }
}

let timer;
function startChrono() {
  let time = 30; // 30 secondes
  updateChrono(time);

  timer = setInterval(() => {
    time--;
    updateChrono(time);

    if (time <= 10) {
      chronoDisplay.classList.add('danger');
      if (time >= 0) { new Audio("tic.mp3").play().catch(()=>{}); }
    }

    if (time <= 0) {
      clearInterval(timer);
      alert("TROP LENT !");
      location.reload();
    }
  }, 1000);
}

function updateChrono(time) {
  chronoDisplay.textContent = `00:${time.toString().padStart(2, '0')}`;
}

startChrono();
</script>

</body>
</html>
